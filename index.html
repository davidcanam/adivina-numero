<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el número</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <h1>Adivina el número</h1>
        <p>Estoy pensando en un número del 1 al 100.</p>

        <label for="numero">Escribe tu número:</label>

        <input
            type="number"
            id="numero"
            min="1"
            max="100"
        >

        <button id="comprobar">Comprobar</button>

        <p id="mensaje">¡Haz tu primer intento!</p>
        <p>Intentos: <span id="intentos">0</span></p>
    </main>
    <script src="juego.js"></script>
</body>
</html>
